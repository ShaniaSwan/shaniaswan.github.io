<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shania Swan | UX/UI & XR Designer</title>
  <meta
    name="description"
    content="Portfolio of Shania Swan, a UX/UI and XR designer creating thoughtful digital, immersive, and product experiences."
  />
  <style>
    :root {
      --bg: #0f1115;
      --surface: #151821;
      --surface-2: #1b1f2a;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f7f3ec;
      --muted: #b9bdc8;
      --soft: #e7d6b3;
      --accent: #d9ad54;
      --accent-2: #7dc9bd;
      --ink: #101014;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      --max: 1180px;
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        radial-gradient(circle at 18% 8%, rgba(217, 173, 84, 0.12), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(125, 201, 189, 0.11), transparent 25%),
        var(--bg);
      background-size: 44px 44px, 44px 44px, auto, auto, auto;
      color: var(--text);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img,
    iframe {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(var(--max), calc(100% - 2rem));
      margin: 0 auto;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 17, 21, 0.82);
      backdrop-filter: blur(18px);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 74px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 750;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: linear-gradient(135deg, var(--accent), #f4dfaa);
      box-shadow: 0 0 0 6px rgba(217, 173, 84, 0.08);
